name: Continuous Integration

on:
  push:
    branches: [main, develop, "release/**"]
  pull_request:
    branches: [main]

jobs:

  # ── Tests: pytest + coverage + lint (3.11 + 3.12) ──
  tests:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Test with pytest and coverage
        run: |
          python -m pytest --cov=solo --cov-report=term-missing --cov-fail-under=90 -q

  # ── Package: wheel build + clean-room ──
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
      - name: Build wheel
        run: |
          python -m build
      - name: Clean venv + install from wheel
        shell: pwsh
        run: |
          python -m venv _clean_venv
          $solo = ".\_clean_venv\Scripts\solo.exe"
          $wheel = (Get-ChildItem .\dist\*.whl | Select-Object -First 1).FullName
          & ".\_clean_venv\Scripts\python.exe" -m pip install --upgrade pip
          & ".\_clean_venv\Scripts\python.exe" -m pip install $wheel
          $env:DEEPSEEK_API_KEY=""
          $env:OPENAI_API_KEY=""
          $env:ZHIPU_API_KEY=""
          $env:GEMINI_API_KEY=""
          $env:SOLO_MODE="lite"
          & $solo version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $solo doctor --json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $solo demo safe --json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $solo demo veto --json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $solo cleanup --json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: solo-agent-wheel
          path: dist/*.whl

  # ── Ruff: linting ──
  ruff:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff
      - name: Run ruff check
        run: |
          python -m ruff check src/solo tests -q

  # ── YAML validation ──
  yaml:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PyYAML
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyyaml
      - name: Validate YAML files
        run: |
          python scripts/ci/validate_yaml.py

  # ── Docs contract ──
  docs-contract:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate docs
        run: |
          python scripts/ci/validate_docs.py

  # ── Secret scan (gitleaks via direct install) ──
  secret-scan:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          choco install gitleaks -y --no-progress 2>$null
          if (-not (Get-Command gitleaks -ErrorAction SilentlyContinue)) {
            iwr -Uri "https://github.com/gitleaks/gitleaks/releases/download/v8.24.0/gitleaks_8.24.0_windows_x64.zip" -OutFile "$env:TEMP\gitleaks.zip"
            Expand-Archive "$env:TEMP\gitleaks.zip" -DestinationPath "$env:TEMP\gitleaks" -Force
            $env:PATH += ";$env:TEMP\gitleaks"
          }
      - name: Run gitleaks
        run: |
          gitleaks detect --source . --redact --no-banner -v
      - name: Run gitleaks (no findings fallback)
        if: failure()
        run: |
          echo "::warning::Gitleaks binary installation may have failed. Checking with alternative method."
          iwr -Uri "https://github.com/gitleaks/gitleaks/releases/download/v8.18.2/gitleaks_8.18.2_windows_x64.zip" -OutFile "$env:TEMP\gitleaks2.zip"
          Expand-Archive "$env:TEMP\gitleaks2.zip" -DestinationPath "$env:TEMP\gitleaks2" -Force
          & "$env:TEMP\gitleaks2\gitleaks.exe" detect --source . --redact --no-banner -v

  # ── Model contract ──
  model-contract:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run model contract validator
        run: |
          python scripts/ci/validate_model_contract.py
